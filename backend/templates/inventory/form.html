{% extends 'base.html' %}

{% block title %}Register New Device - Gadget Deluxe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border p-4 shadow-lg">
            <h3 class="fw-bold mb-4 border-bottom pb-3">
                <i class="fa-solid fa-mobile-screen-button text-primary me-2"></i>Register New Device
            </h3>

            <form method="post" action="{% url 'inventory:add' %}">
                {% csrf_token %}
                
                <h5 class="text-primary fw-semibold mb-3">Identifiers & Specs</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">IMEI (Primary) *</label>
                        <input type="text" name="imei" class="form-control" required placeholder="e.g. 352049102938475">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">IMEI 2</label>
                        <input type="text" name="imei2" class="form-control" placeholder="Optional dual SIM IMEI">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Serial Number</label>
                        <input type="text" name="serial_number" class="form-control" placeholder="e.g. F2LDK948H1">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">MEID</label>
                        <input type="text" name="meid" class="form-control" placeholder="Optional MEID">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Model Name *</label>
                        <input type="text" name="model" id="device_model" list="model-options" class="form-control" required placeholder="Select or type model...">
                        <datalist id="model-options">
                            <option value="iPhone 16 Pro Max">
                            <option value="iPhone 16 Pro">
                            <option value="iPhone 16 Plus">
                            <option value="iPhone 16">
                            <option value="iPhone 15 Pro Max">
                            <option value="iPhone 15 Pro">
                            <option value="iPhone 15 Plus">
                            <option value="iPhone 15">
                            <option value="iPhone 14 Pro Max">
                            <option value="iPhone 14 Pro">
                            <option value="iPhone 14 Plus">
                            <option value="iPhone 14">
                            <option value="iPhone 13 Pro Max">
                            <option value="iPhone 13 Pro">
                            <option value="iPhone 13">
                            <option value="iPhone 13 mini">
                            <option value="iPhone 12 Pro Max">
                            <option value="iPhone 12 Pro">
                            <option value="iPhone 12">
                            <option value="iPhone 12 mini">
                            <option value="iPhone 11 Pro Max">
                            <option value="iPhone 11 Pro">
                            <option value="iPhone 11">
                            <option value="iPhone XS Max">
                            <option value="iPhone XS">
                            <option value="iPhone XR">
                            <option value="iPhone X">
                            <option value="iPhone SE (3rd Gen)">
                            <option value="iPhone SE (2nd Gen)">
                            <option value="iPad Pro 13 (M4)">
                            <option value="iPad Pro 11 (M4)">
                            <option value="iPad Air 13 (M2)">
                            <option value="iPad Air 11 (M2)">
                            <option value="iPad (10th Gen)">
                            <option value="iPad mini (6th Gen)">
                        </datalist>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Model Description</label>
                        <input type="text" name="model_description" id="device_description" class="form-control" placeholder="Auto-generated from Model, Capacity & Color">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">Capacity / Storage</label>
                        <input type="text" name="capacity" id="device_capacity" list="capacity-options" class="form-control" placeholder="Select or type storage...">
                        <datalist id="capacity-options">
                            <option value="64GB">
                            <option value="128GB">
                            <option value="256GB">
                            <option value="512GB">
                            <option value="1TB">
                            <option value="2TB">
                            <option value="32GB">
                            <option value="16GB">
                        </datalist>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">Color</label>
                        <input type="text" name="color" id="device_color" list="color-options" class="form-control" placeholder="Select or type color...">
                        <datalist id="color-options">
                            <option value="Natural Titanium">
                            <option value="Black Titanium">
                            <option value="White Titanium">
                            <option value="Desert Titanium">
                            <option value="Blue Titanium">
                            <option value="Space Black">
                            <option value="Silver">
                            <option value="Gold">
                            <option value="Deep Purple">
                            <option value="Midnight">
                            <option value="Starlight">
                            <option value="Space Gray">
                            <option value="Graphite">
                            <option value="Sierra Blue">
                            <option value="Alpine Green">
                            <option value="Pacific Blue">
                            <option value="Pink">
                            <option value="Yellow">
                            <option value="Green">
                            <option value="Blue">
                            <option value="Purple">
                            <option value="Teal">
                            <option value="Ultramarine">
                            <option value="Product(RED)">
                        </datalist>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">Battery Health (%)</label>
                        <input type="number" name="battery_health" min="0" max="100" class="form-control" placeholder="e.g. 100">
                    </div>
                </div>

                <h5 class="text-primary fw-semibold mb-3">Device Variant, Pricing & Status</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Variant</label>
                        <select name="variant" class="form-select">
                            <option value="">-- Select Variant --</option>
                            {% for code, label in variant_choices %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-danger">Buying Price (BDT) *</label>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">BDT</span>
                            <input type="number" step="0.01" min="0" name="buying_price" id="buying_price_input" class="form-control" required placeholder="e.g. 65000.00">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Initial Status</label>
                        <select name="current_status" class="form-select">
                            {% for code, label in status_choices %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Associate Shipment</label>
                        <select name="current_shipment" class="form-select">
                            <option value="">No Shipment Assigned</option>
                            {% for shipment in shipments %}
                                <option value="{{ shipment.id }}">#{{ shipment.tracking_number }} ({{ shipment.supplier.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'inventory:list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="fa-solid fa-save me-1"></i> Save Device</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modelInput = document.getElementById('device_model');
    const capInput = document.getElementById('device_capacity');
    const colorInput = document.getElementById('device_color');
    const descInput = document.getElementById('device_description');

    let isCustomDesc = false;

    if (descInput) {
        descInput.addEventListener('input', function() {
            if (descInput.value.trim().length > 0) {
                isCustomDesc = true;
            } else {
                isCustomDesc = false;
            }
        });
    }

    function updateDescription() {
        if (isCustomDesc && descInput.value.trim().length > 0) return;
        const m = (modelInput ? modelInput.value.trim() : '');
        const c = (capInput ? capInput.value.trim() : '');
        const col = (colorInput ? colorInput.value.trim() : '');
        const parts = [m, c, col].filter(Boolean);
        if (descInput) {
            descInput.value = parts.join(' ');
        }
    }

    [modelInput, capInput, colorInput].forEach(input => {
        if (input) {
            input.addEventListener('input', updateDescription);
            input.addEventListener('change', updateDescription);
        }
    });
});
</script>
{% endblock %}
