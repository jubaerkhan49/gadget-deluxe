<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gadget Deluxe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: var(--bs-body-bg);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="login-card card p-4 shadow-lg">
        <div class="text-center mb-4">
            <div class="display-6 text-primary mb-2">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <h3 class="fw-bold">Gadget Deluxe</h3>
            <p class="text-muted small">Enter your credentials to access the inventory system</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary border"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" required autofocus placeholder="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-body-secondary border"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small">Default Demo Credentials: admin / Admin123!</span>
        </div>
    </div>
</body>
</html>
